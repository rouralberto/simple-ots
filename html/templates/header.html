<!DOCTYPE html>
<html lang="{{t:lang}}" data-bs-theme="dark" data-i18n="{{I18N}}">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="robots" content="noindex, nofollow">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{PREVIEW_DESCRIPTION}}">
    <meta name="theme-color" content="#212529">
    <link rel="icon" href="{{FAVICON}}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{TOUCH_ICON}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Simple OTS">
    <meta property="og:title" content="{{PREVIEW_TITLE}}">
    <meta property="og:description" content="{{PREVIEW_DESCRIPTION}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Simple OTS">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@0.13.1/dist/js-confetti.browser.js" integrity="sha384-HjGVVWzPEDyUTwFJWnSRo0iVQwCLYB49oBLXpizUSDwKTRZBXXCWPFdYmb3VWjM2" crossorigin="anonymous" defer></script>
    <script src="{{CRYPTO_JS}}" defer></script>
    <script src="{{APP_JS}}" defer></script>
</head>
<body>
<nav class="navbar border-bottom mb-5">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-shield-lock me-2"></i>Simple OTS</a>
        <!-- Not flex itself: Bootstrap's .d-flex would override the hidden attribute. Shown by app.js. -->
        <div id="language-picker" hidden>
            <div class="d-flex align-items-center">
                <i class="bi bi-translate text-body-secondary me-2" aria-hidden="true"></i>
                <select id="language" class="form-select form-select-sm w-auto" aria-label="{{t:nav.language}}" data-current="{{LOCALE}}">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="zh">中文</option>
                    <option value="th">ไทย</option>
                </select>
            </div>
        </div>
    </div>
</nav>
<main class="container">
<div class="row">
<div class="col-lg-8 offset-lg-2">
