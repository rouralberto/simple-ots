<noscript>
    <div class="alert alert-danger" role="alert">
        {{t:create.noscript}}
    </div>
</noscript>

<section id="create">
    <h1 class="h3">{{t:create.title}}</h1>
    <p class="text-body-secondary">
        {{t:create.intro}}
    </p>

    <form id="secret-form" data-csrf-token="{{CSRF_TOKEN}}" novalidate>
        <div class="mb-3">
            <label class="form-label" for="secret">{{t:secret.label}}</label>
            <textarea class="form-control font-monospace" id="secret" rows="6" maxlength="20000" required autofocus
                      placeholder="{{t:create.secret_placeholder}}"></textarea>
            <div class="invalid-feedback">{{t:create.secret_required}}</div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="expiry">{{t:create.expiry_label}}</label>
            <select class="form-select" id="expiry">
                <option value="3600">{{t:create.expiry.hour}}</option>
                <option value="86400">{{t:create.expiry.day}}</option>
                <option value="604800">{{t:create.expiry.week}}</option>
            </select>
        </div>

        <div id="create-error" class="alert alert-danger" role="alert" hidden></div>

        <button type="submit" id="submit-btn" class="btn btn-lg btn-success w-100">
            <i class="bi bi-lock me-2"></i>{{t:create.submit}}
        </button>

        <p class="text-center mt-3 small text-body-secondary">
            <i class="bi bi-shield-lock me-1"></i>
            {{t:create.zero_knowledge}}
        </p>
    </form>
</section>

<section id="created" hidden>
    <h1 class="h3"><i class="bi bi-check-circle text-success me-2"></i>{{t:created.title}}</h1>
    <p>{{t:created.intro}}</p>

    <label class="form-label visually-hidden" for="sharing-url">{{t:created.link_label}}</label>
    <div class="input-group mb-2">
        <input id="sharing-url" type="text" class="form-control font-monospace" readonly>
        <button type="button" class="btn btn-success" data-copy-target="sharing-url">
            <i class="bi bi-copy me-2"></i><span>{{t:created.copy}}</span>
        </button>
    </div>
    <p class="small text-body-secondary">
        <i class="bi bi-info-circle me-1"></i>
        {{t:created.key_hint}}
    </p>

    <button type="button" id="create-another" class="btn btn-outline-light mt-3">
        <i class="bi bi-plus-circle me-2"></i>{{t:created.another}}
    </button>
</section>
