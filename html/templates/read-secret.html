<div id="reveal" data-uuid="{{UUID}}">
    <h1 class="h3">{{t:reveal.title}}</h1>

    <div id="reveal-intro">
        <p>
            {{t:reveal.intro}}
        </p>
        <p class="small text-body-secondary">
            <i class="bi bi-clock me-1"></i>{{t:reveal.expires}}
        </p>

        <div id="reveal-key-missing" class="alert alert-danger" role="alert" hidden>
            <i class="bi bi-exclamation-triangle me-2"></i>
            {{t:reveal.key_missing}}
        </div>

        <button id="reveal-button" type="button" class="btn btn-lg btn-success">
            <i class="bi bi-eye me-2"></i>{{t:reveal.button}}
        </button>
    </div>

    <div id="reveal-error" class="alert alert-danger mt-4" role="alert" hidden></div>

    <div id="reveal-result" hidden>
        <div class="alert alert-warning" role="status">
            <i class="bi bi-fire me-2"></i>{{t:reveal.deleted}}
        </div>
        <label class="form-label" for="secret-output">{{t:secret.label}}</label>
        <textarea id="secret-output" class="form-control font-monospace" rows="4" readonly></textarea>
        <div class="mt-2 d-flex justify-content-between align-items-center gap-3 flex-wrap">
            <p class="small text-body-secondary mb-0">
                <i class="bi bi-shield-lock me-1"></i>{{t:reveal.decrypted}}
            </p>
            <button type="button" class="btn btn-success" data-copy-target="secret-output">
                <i class="bi bi-copy me-2"></i><span>{{t:reveal.copy}}</span>
            </button>
        </div>
    </div>
</div>
